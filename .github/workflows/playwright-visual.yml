name: Playwright visual verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/janus-public-home-login]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Chromium desktop and mobile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install Playwright Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Typecheck and build
        run: |
          npm run typecheck
          npm run build

      - name: Run unit and integration checks
        run: npm test

      - name: Run visual browser suite
        run: npm run test:browser -- --reporter=list,html

      - name: Upload screenshots and Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: janus-playwright-visual-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
